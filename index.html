<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <link href="style/interface.css?v=3.2" rel="stylesheet" type="text/css">
    <script>
        var ccAppPrefix = "https://demo.contentcontroller.com";
        var ccPackageToken = "4491c990-a83e-4f99-9670-3d979fbbf154";
    </script>
    <script src="https://demo.contentcontroller.com/launcherlink/3rd.js?v=3.2" type="text/javascript"></script>
    <script src="config.js?v=3.2" type="text/javascript"></script>
    <script src="https://demo.contentcontroller.com/launcherlink/launcherinit.js?v=3.2" type="text/javascript"></script>
    <script src="https://demo.contentcontroller.com/launcherlink/ssla.min.js?v=3.2" type="text/javascript"></script>
    <script>
(function() {
    // 1. Setup
    const authorizedPortal = "mbyrd27.github.io";
    const authorizedProxy = "demo.contentcontroller.com";
    const ref = document.referrer.toLowerCase();
    let isAuthorized = false;

    // 2. Logic: We verify if the user came from the portal or the proxy
    // If you launch from the portal, the referrer will be mbyrd27.github.io.
    // If the proxy redirects you, the referrer will be demo.contentcontroller.com.
    if (ref.includes(authorizedPortal) || ref.includes(authorizedProxy)) {
        isAuthorized = true;
    }

    // 3. Stage 2: Anti-Bypass check
    // If someone copy-pastes the link, the referrer will be EMPTY.
    if (ref === "") {
        isAuthorized = false;
    }

    // 4. Enforcement
    if (!isAuthorized) {
        document.documentElement.innerHTML = `
            <body style="font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; background:#f9f9f9;">
                <div style="text-align:center; padding:20px; border:2px solid #ff4d4d; border-radius:8px; background:#fff;">
                    <h1 style="color:#ff4d4d;">Oops! Unauthorized Launch</h1>
                    <p>This content must be launched through the official learning portal.</p>
                </div>
            </body>`;
        window.stop(); 
        throw new Error("Execution halted: Unauthorized Source");
    }
    
    // If we get here, it's authorized. The rest of the page (SCORM/TinCan) will load.
})();
</script>
</head>

<body onload="prepareLaunch(ccAppPrefix, ccPackageToken)" onbeforeunload="ssla.finish()" class="hide-menu hide-toc">
<div class="jca-navigation-menu">
    <img id="logo" src="images/logo2.png" />
    <div class="player-exit">
        <button class="nav-button" id="exit" onClick="ssla.navigate('exit')">Exit</button>
    </div>
    <div class="sco-navigation">
        <button class="nav-button" id="closeActive" onClick="ssla.closeActiveContent()">Close Activity</button>
        <button class="nav-button" id="prev" onClick="ssla.navigate('previous')">Previous</button>
        <button class="nav-button" id="next" onClick="ssla.navigate('next')">Next</button>
    </div>
</div>
<div class="jca-toc-holder">
    <div id="title">
        <!-- Placeholder Title -->
    </div>
    <div id="toc">
    </div>
</div>

<div id="frame-here">
</div>

</body>
</html>
